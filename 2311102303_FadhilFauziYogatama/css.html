<!DOCTYPE html>
<html>
<head>
    <title>Imlek Bucin ❤️</title>
    <style>
        body {
            background: linear-gradient(#8B0000, #FF0000);
            color: gold;
            text-align: center;
            font-family: Arial;
        }

        .card {
            margin-top: 100px;
            padding: 30px;
            border: 3px solid gold;
            border-radius: 20px;
            display: inline-block;
            background: rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 40px;
        }

        .heart {
            color: pink;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Gong Xi Fa Cai ❤️</h1>
    <p>Semoga kita selalu bersama ya ndut 🥰</p>
    <p class="heart">💖 💖 💖</p>
</div>

</body>
</html>
