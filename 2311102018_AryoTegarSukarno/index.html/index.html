<html>

<title>Tabel dan Formulir</title>
</head>

<body>

<center>
<table border="1" cellpadding="10">

<th>Nama</th>
<th>Umur</th>
<th>Kota</th>
</tr>

<td>Aryo</td>
<td>20</td>
<td>Semarang</td>
</tr>

<tr>

</tr>

<tr>

<td>Bandung</td>
</tr>
</table>

<br><br>

<br><br>

<h1>Formulir Pendaftaran</h1>

<form>

nama : <input type="text" placeholder="masukan nama">
<br><br>

status :
<input type="text" value="mahasiswa">
<br><br>

password :
<input type="password">
<br><br>

email :
<input type="email">
<br><br>

jenis kelamin :
<input type="radio" name="jk"> laki laki
<input type="radio" name="jk"> perempuan
<br><br>

hobi :
<input type="checkbox"> ngoding
<input type="checkbox"> naik gunung
<input type="checkbox"> bersepeda
<br><br>

jenjang pendidikan :
<select>
<option>Pilih pendidikan</option>
<option>SMA</option>
<option>D3</option>
<option>S1</option>
<option>S2</option>
</select>

<br><br>

kritik dan saran :
<br>
<textarea placeholder="masukan kritik"></textarea>

<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
